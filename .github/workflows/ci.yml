name: CI

# Gates every push and PR with the same checks a contributor runs locally:
# lint (ESLint + Prettier), typecheck (tsc), and a production build.
#
# Install uses `npm ci --legacy-peer-deps` against the public package-lock.json
# — the exact path Cloudflare Workers Builds uses to deploy. bun is canonical
# for local dev (see bunfig.toml / bun.lock), but bun.lock pins a few packages
# to Lovable's private mirror that 403s in CI, so CI deliberately uses npm to
# match production and stay reproducible.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: lint · typecheck · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint (ESLint + Prettier)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
